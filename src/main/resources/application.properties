spring.application.name=backend-service

server.servlet.context-path=/ 
=================================================================

1. H2 DATABASE CONNECTION (In-Memory for Development)

=================================================================

Creates a temporary database named 'trivia-db' in memory.

This setup is lost when the app stops, perfect for development testing.

spring.datasource.url=jdbc:h2:mem:trivia-db

spring.datasource.driverClassName=org.h2.Driver

spring.datasource.username=sa

spring.datasource.password=password



H2 Console: Allows you to view the database tables in your browser

Access it at: http://localhost:8080/h2-console

spring.h2.console.enabled=true

spring.h2.console.path=/h2-console



=================================================================

2. JPA/HIBERNATE SETTINGS

=================================================================

Tells Spring to automatically drop existing tables and create new ones based on the @Entity classes.

spring.jpa.hibernate.ddl-auto=create-drop



Displays the SQL Hibernate runs in your console, useful for debugging.

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true should I add this there